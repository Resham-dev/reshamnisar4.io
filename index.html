<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Resham Nisar | Designer Developer</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: "Segoe UI", Arial, sans-serif;
      background: #030817;
      color: #fff;
      overflow-x: hidden;
    }

    header {
      width: 100%;
      height: 90px;
      background: #913492;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 65px;
      position: fixed;
      top: 0;
      left: 0;
      z-index: 100;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .logo-img {
      width: 70px;
      height: 55px;
      object-fit: contain;
      background: rgba(255,255,255,0.15);
      border-radius: 8px;
    }

    .logo-text h2 {
      font-size: 22px;
      line-height: 1;
      font-weight: 700;
    }

    .logo-text p {
      font-size: 13px;
      letter-spacing: 1px;
      color: #f2dff5;
    }

    nav {
      display: flex;
      gap: 55px;
    }

    nav a {
      color: #fff;
      text-decoration: none;
      font-size: 22px;
      font-weight: 700;
      transition: 0.3s;
    }

    nav a:hover {
      color: #17c9ff;
    }

    .hero {
      min-height: 100vh;
      padding-top: 90px;
      position: relative;
      background: #030817;
    }

    .hero-bg {
      width: 100%;
      min-height: calc(100vh - 90px);
      background:
        linear-gradient(
          rgba(2, 7, 24, 0.05),
          rgba(2, 7, 24, 0.25)
        ),
        url("bg.png");
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
    }

    .placeholder-text {
      text-align: center;
      max-width: 700px;
      padding: 40px;
      border: 1px dashed rgba(255,255,255,0.35);
      border-radius: 25px;
      background: rgba(255,255,255,0.05);
      backdrop-filter: blur(12px);
    }

    .placeholder-text h1 {
      font-size: 58px;
      line-height: 1.1;
      margin-bottom: 18px;
    }

    .placeholder-text span {
      color: #13c8ff;
    }

    .placeholder-text p {
      font-size: 18px;
      color: #dbeafe;
    }

    @media (max-width: 900px) {
      header {
        height: auto;
        padding: 20px;
        flex-direction: column;
        gap: 18px;
      }

      nav {
        gap: 22px;
        flex-wrap: wrap;
        justify-content: center;
      }

      nav a {
        font-size: 17px;
      }

      .hero {
        padding-top: 150px;
      }

      .hero-bg {
        align-items: center;
        min-height: calc(100vh - 150px);
      }

      .placeholder-text h1 {
        align-items: center;
        font-size: 38px;
      }
    }

    @media (max-width: 500px) {
      header {
        padding: 16px;
      }

      .logo-img {
        width: 58px;
        height: 45px;
      }

      .logo-text h2 {
        font-size: 18px;
      }

      nav {
        gap: 16px;
      }

      nav a {
        font-size: 15px;
      }

      .placeholder-text {
        align-items: center;
        margin: 20px;
        padding: 28px;
      }

      .placeholder-text h1 {
        align-items: center;
        font-size: 30px;
      }
    }
  </style>
</head>

<body>

  <header>
    <div class="logo">
      <div class="logo-text">
        <h1>Resham Nisar</h1>
        <p>Designer. Developer</p>
      </div>
    </div>

    <nav>
      <a href="#">Home</a>
      <a href="#">About</a>
      <a href="#">Work</a>
      <a href="#">Skills</a>
      <a href="#">Contact</a>
    </nav>
  </header>

  <section class="hero">
    <!-- Remove "placeholder" class when using your real image -->
    <div class="hero-bg">

    </div>
  </section>

</body>
</html>
